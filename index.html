<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Master - MVVM Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- View estática: só "âncoras" onde o JavaScript insere os dados -->
    <div id="app" class="container">
        <h1>Task Master (MVVM)</h1>

        <div id="errorMessage" class="error" hidden></div>

        <div class="form-group">
            <input type="text" id="taskTitle" placeholder="O que precisa ser feito?">
            <input type="text" id="taskDescription" placeholder="Descrição (opcional)">
            <input type="date" id="taskDueDate">
            <button id="addBtn">Adicionar</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script src="js/TaskViewModel.js"></script>
</body>
</html>
